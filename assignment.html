<!doctype html>
<html>
  <head>
    <title>Pheonix Royal Hotel</title>
  </head>
  <body>
    <!-- Background Image -->
    <section
      style="
        position: relative;
        width: 100%;
        height: 660px;
        overflow: hidden;
      "
    >
      <img
        src="Frame 28.png"
        alt="Pheonix Royal Hotel"
        style="
          position: absolute;
          right: 0;
          bottom: 0;
          top: 0;
          left: 0;
          width: 100%;
          height: auto;
        "
      />
      <div
        style="
          position: relative;
          padding: 20px;
          font-size: 15px;
          display: flex;
          align-items: center;
          justify-content: space-around;
        "
      >
        <!-- Logo -->
        <img
          src="Black Gold Luxury and Vintage Royal Hotel Logo 1.jpg"
          alt="Pheonix Royal Hotel"
          width="80px"
          height="80px"
          style="border-radius: 100px"
        />
        <div
          style="
            background-color: transparent;
            border: 0.5px solid white;
            color: white;
            padding: 10px 30px;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 330px;
            height: 20px;
            border-radius: 30px;
          "
        >
          <!-- Navigation -->
          <nav
            style="
              display: flex;
              flex-direction: row;
              justify-content: space-around;
              align-items: center;
              gap: 20px;
              color:white;
            "
          >
            <a href="Home.html" style="text-decoration: none; color: white"
              >Home</a
            >
            <a href="About Us.html" style="text-decoration: none; color: white"
              >About Us</a
            >
            <a href="Rooms.html" style="text-decoration: none; color: white"
              >Rooms</a
            >
            <a href="Amenities.html" style="text-decoration: none; color: white"
              >Amenities</a
            >
            <a href="Gallery.html" style="text-decoration: none; color: white"
              >Gallery</a
            >
          </nav>
        </div>

        <!-- Book Now Button -->
        <button
          style="
            background-color: rgb(0, 81, 0);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            height: 40px;
            display: flex;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
          "
          type="button"
          onmouseover="
            this.style.backgroundColor = 'white';
            this.style.color = 'rgb(0, 81, 0)';
          "
          onmouseout="
            this.style.backgroundColor = 'rgb(0, 81, 0)';
            this.style.color = 'white';
          "
        >
          <pre>Book Now <b>></b></pre>
        </button>
      </div>
      <!--welcome message  -->
      <div>
        <h2
          style="
            text-align: center;
            color: white;
            font-size: 24px;
            margin-top: 20px;
            padding: 70px 0px 0px 0px;
            position: relative;
            font-family: EB Garamond;
          "
        >
          Welcome to Pheonix Royal Hotel
        </h2>
        <h1
          style="
            text-align: center;
            color: white;
            font-size: 50px;
            margin-top: 20px;
            position: relative;
            font-family: Frank Ruhi Libre;
          "
        >
          Tastefully furnished rooms, <br />Unparalleled Comfort.
        </h1>
      </div>
    </section>
  </body>
</html>
